<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxeShop — Premium Store</title>

  <!-- ✅ PWA: Tells mobile browsers to use the manifest for the app icon/name -->
  <link rel="manifest" href="/manifest.json" />

  <!-- ✅ PWA: Controls layout on mobile – no zoom, full width -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <!-- ✅ PWA: Theme color for browser chrome (address bar on Android) -->
  <meta name="theme-color" content="#0e0e0c" />

  <!-- ✅ PWA: Makes app look native when added to iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LuxeShop" />

  <!-- ✅ PWA: iOS home screen icon (Apple doesn't use manifest icons) -->
  <link rel="apple-touch-icon" href="/logo192.png" />

  <!-- SEO / Social -->
  <meta name="description" content="LuxeShop — Premium e-commerce experience. Shop electronics, fashion & more." />
  <meta name="keywords" content="shop, ecommerce, luxury, electronics, fashion" />
  <meta property="og:title" content="LuxeShop" />
  <meta property="og:description" content="Premium e-commerce experience" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
