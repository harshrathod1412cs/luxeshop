<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxeShop — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0e0c;
      color: #faf8f4;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #fbbf24; }
    p { color: #a8a890; max-width: 320px; line-height: 1.6; }
    button {
      background: #fbbf24;
      color: #0e0e0c;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="icon">🛍️</div>
  <h1>You're Offline</h1>
  <p>No internet connection found. Check your connection and try again — your cart is safely saved!</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
